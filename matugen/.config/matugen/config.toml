# Matugen Configuration (v4.x)
# Generated outputs live under $XDG_STATE_HOME/theme/generated/ (defaults to ~/.local/state)

[config]
# Automatically pick the dominant source color without interactive prompt
source_color_index = 0

[templates.colors_json]
input_path = "~/.config/matugen/templates/colors.json.tpl"
output_path = "~/.local/state/theme/generated/colors.json"

[templates.hypr_colors]
input_path = "~/.config/matugen/templates/hypr-colors.conf.tpl"
output_path = "~/.local/state/theme/generated/hypr-colors.conf"

[templates.kitty_colors]
input_path = "~/.config/matugen/templates/kitty-colors.conf.tpl"
output_path = "~/.local/state/theme/generated/kitty-colors.conf"

[templates.btop_theme]
input_path = "~/.config/matugen/templates/btop.theme.tpl"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.nvim_colors]
input_path = "~/.config/matugen/templates/nvim-colors.lua.tpl"
output_path = "~/.local/state/theme/generated/nvim-colors.lua"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css.tpl"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css.tpl"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.prismlauncher]
input_path = "~/.config/matugen/templates/prismlauncher-theme.json.tpl"
output_path = "~/.local/share/PrismLauncher/themes/Matugen/theme.json"

[templates.spotify]
input_path = "~/.config/matugen/templates/spotify-color.ini.tpl"
output_path = "~/.config/spicetify/Themes/Matugen/color.ini"

[templates.spotify_css]
input_path = "~/.config/matugen/templates/spotify-user.css.tpl"
output_path = "~/.config/spicetify/Themes/Matugen/user.css"

[templates.steam]
input_path = "~/.config/matugen/templates/steam-millennium.css.tpl"
output_path = "~/.local/share/Steam/millennium/themes/Matugen/webkit.css"

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop.theme.css.tpl"
output_path = "~/.config/vesktop/themes/Matugen.theme.css"

[templates.vesktop_quickcss]
input_path = "~/.config/matugen/templates/vesktop.theme.css.tpl"
output_path = "~/.config/vesktop/settings/quickCss.css"


[templates.vencord]
input_path = "~/.config/matugen/templates/vesktop.theme.css.tpl"
output_path = "~/.config/Vencord/themes/Matugen.theme.css"






