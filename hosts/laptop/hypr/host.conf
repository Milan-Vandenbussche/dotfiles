################
### MONITORS ###
################

# Built-in laptop display, BOE panel.
monitor = eDP-1, 1920x1200@60, 0x0, 1.25

###################
### INPUT DEVICES ###
###################

# External mouse used with the laptop.
device {
    name = glorious-model-o
    sensitivity = 0.0
}

xwayland {
    force_zero_scaling = true
}
